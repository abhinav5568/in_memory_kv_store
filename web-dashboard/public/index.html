<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PulseKV Live Telemetry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header & User Input -->
    <div class="flex justify-between items-center bg-gray-800 p-6 rounded-xl border border-gray-700">
      <div>
        <h1 class="text-2xl font-bold text-cyan-400">KV Engine Monitor</h1>
        <p class="text-gray-400 text-sm">Real-time TCP Key-Value Telemetry</p>
      </div>
      <div class="flex gap-2">
        <input id="userIdInput" type="text" placeholder="Paste User UUID..." 
               class="bg-gray-900 border border-gray-700 text-white px-4 py-2 rounded-lg w-80 text-sm focus:outline-none focus:border-cyan-500" />
        <button onclick="startMonitoring()" 
                class="bg-cyan-600 hover:bg-cyan-500 font-semibold px-5 py-2 rounded-lg text-sm transition">
          Connect
        </button>
      </div>
    </div>

    <!-- Top KPI Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
        <p class="text-gray-400 text-xs font-semibold uppercase">Server Uptime</p>
        <p id="uptimeVal" class="text-2xl font-bold mt-1 text-emerald-400">0s</p>
      </div>
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
        <p class="text-gray-400 text-xs font-semibold uppercase">Heap Memory</p>
        <p id="heapVal" class="text-2xl font-bold mt-1 text-purple-400">0 MB</p>
      </div>
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
        <p class="text-gray-400 text-xs font-semibold uppercase">Active Sockets</p>
        <p id="socketsVal" class="text-2xl font-bold mt-1 text-blue-400">0</p>
      </div>
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
        <p class="text-gray-400 text-xs font-semibold uppercase">Total Keys</p>
        <p id="keysVal" class="text-2xl font-bold mt-1 text-yellow-400">0</p>
      </div>
    </div>

    <!-- Grid: Table & Donut Chart -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Cache Table (2 cols) -->
      <div class="lg:col-span-2 bg-gray-800 p-6 rounded-xl border border-gray-700">
        <h2 class="text-lg font-bold mb-4 text-gray-200">Active LRU Caches</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-gray-300">
            <thead class="bg-gray-900/50 text-gray-400 uppercase text-xs">
              <tr>
                <th class="p-3">Cache ID</th>
                <th class="p-3">Keys</th>
                <th class="p-3">Hits</th>
                <th class="p-3">Misses</th>
                <th class="p-3">Evictions</th>
                <th class="p-3">Cmds</th>
              </tr>
            </thead>
            <tbody id="cacheTableBody">
              <tr><td colspan="6" class="p-4 text-center text-gray-500">Enter User ID above to stream live cache data</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Ratio Chart (1 col) -->
      <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 flex flex-col items-center">
        <h2 class="text-lg font-bold mb-4 text-gray-200">Hit / Miss Ratio</h2>
        <div class="w-56 h-56">
          <canvas id="ratioChart"></canvas>
        </div>
      </div>

    </div>
  </div>

  <script>
    let pollInterval = null;
    let ratioChart = null;

    // Initialize Chart.js Donut
    const ctx = document.getElementById('ratioChart').getContext('2d');
    ratioChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Hits', 'Misses'],
        datasets: [{
          data: [0, 0],
          backgroundColor: ['#10B981', '#EF4444'],
          borderWidth: 0
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });

    function startMonitoring() {
      const userId = document.getElementById('userIdInput').value.trim();
      if (!userId) return alert('Please enter a User ID');

      if (pollInterval) clearInterval(pollInterval);

      // Fetch every 1 second
      pollTelemetry(userId);
      pollInterval = setInterval(() => pollTelemetry(userId), 1000);
    }

    async function pollTelemetry(userId) {
      try {
        const res = await fetch(`/api/telemetry/${userId}`);
        const data = await res.json();

        if (data.error) return;

        const { sys_metrics = {}, cache_metrics = [] } = data;

        // 1. Update KPI Cards
        document.getElementById('uptimeVal').innerText = `${sys_metrics.uptime_seconds || 0}s`;
        document.getElementById('heapVal').innerText = `${sys_metrics.heap_used_mb || 0} MB`;
        document.getElementById('socketsVal').innerText = sys_metrics.active_connections || 0;

        let totalKeys = 0;
        let totalHits = 0;
        let totalMisses = 0;

        // 2. Render Table Rows
        const tbody = document.getElementById('cacheTableBody');
        tbody.innerHTML = '';

        if (cache_metrics.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-500">No active caches found for this user</td></tr>';
        } else {
          cache_metrics.forEach(c => {
            totalKeys += c.key_count || 0;
            totalHits += c.hit_count || 0;
            totalMisses += c.miss_count || 0;

            const row = `
              <tr class="border-b border-gray-700/50 hover:bg-gray-700/30">
                <td class="p-3 font-mono text-cyan-400 text-xs">${c.cacheID}</td>
                <td class="p-3">${c.key_count}</td>
                <td class="p-3 text-emerald-400">${c.hit_count}</td>
                <td class="p-3 text-rose-400">${c.miss_count}</td>
                <td class="p-3 text-yellow-400">${c.evictions}</td>
                <td class="p-3">${c.commands_interpreted}</td>
              </tr>
            `;
            tbody.innerHTML += row;
          });
        }

        document.getElementById('keysVal').innerText = totalKeys;

        // 3. Update Chart
        ratioChart.data.datasets[0].data = [totalHits, totalMisses];
        ratioChart.update();

      } catch (err) {
        console.error("Telemetry Poll Error:", err);
      }
    }
  </script>
</body>
</html>
